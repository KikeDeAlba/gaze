name: publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: the tag and the manifests have to agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          npm_version="$(jq -r .version package.json)"
          plugin_version="$(jq -r .version .claude-plugin/plugin.json)"
          for found in "$cargo_version" "$npm_version" "$plugin_version"; do
            if [ "$tag" != "$found" ]; then
              echo "the release is $tag and the manifests say $cargo_version (Cargo.toml), $npm_version (package.json), $plugin_version (plugin.json)" >&2
              exit 1
            fi
          done

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: build dependencies for onnxruntime and native-tls
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - run: cargo build --release --locked

      - name: smoke test the binary
        run: ./target/release/gaze capabilities --json | jq -e .ok

      - name: package the binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="gaze-${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C target/release gaze
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: upload the assets to the release
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: embed the checksums of the built archives
        env:
          ARCHIVES: ${{ runner.temp }}/archives
        run: |
          version="$(jq -r .version package.json)"
          assets='{}'
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            file="gaze-${version}-${target}.tar.gz"
            sum="$(sha256sum "$ARCHIVES/$file" | cut -d ' ' -f 1)"
            assets="$(jq -c --arg target "$target" --arg file "$file" --arg sum "$sum" '.[$target] = {file: $file, sha256: $sum}' <<< "$assets")"
          done
          jq -n --arg version "$version" --argjson assets "$assets" '{version: $version, assets: $assets}' > npm/checksums.json
          jq -e '.assets | has("aarch64-apple-darwin") and has("x86_64-unknown-linux-gnu")' npm/checksums.json

      - name: install the tarball the way a person would, and run it
        run: |
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/$tarball"
          "$RUNNER_TEMP/prefix/bin/gaze" capabilities --json

      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
