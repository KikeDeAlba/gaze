name: publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: the tag and the manifests have to agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          npm_version="$(jq -r .version package.json)"
          plugin_version="$(jq -r .version .claude-plugin/plugin.json)"
          port_version="$(jq -r .version packages/gaze-win32/package.json)"
          port_pin="$(jq -r '.optionalDependencies["@kikedealba/gaze-win32"]' package.json)"
          for found in "$cargo_version" "$npm_version" "$plugin_version" "$port_version" "$port_pin"; do
            if [ "$tag" != "$found" ]; then
              echo "the release is $tag and the manifests say $cargo_version (Cargo.toml), $npm_version (package.json), $plugin_version (plugin.json), $port_version (packages/gaze-win32/package.json), $port_pin (optionalDependencies)" >&2
              exit 1
            fi
          done

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: build dependencies for onnxruntime and native-tls
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: smoke test the binary
        shell: bash
        run: |
          "./target/${{ matrix.target }}/release/gaze" capabilities --json | jq -e .ok

      - name: package the binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_dir="target/${{ matrix.target }}/release"
          archive="gaze-${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "$release_dir" gaze
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: upload the assets and their checksums to the release
        shell: bash
        working-directory: ${{ runner.temp }}/archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in gaze-*; do
            sha256sum "$file" > "$file.sha256"
          done
          gh release upload "$GITHUB_REF_NAME" gaze-* --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: embed the checksums of the built assets
        shell: bash
        env:
          ARCHIVES: ${{ runner.temp }}/archives
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          assets='{}'
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            file="gaze-${version}-${target}.tar.gz"
            sum="$(sha256sum "$ARCHIVES/$file" | cut -d ' ' -f 1)"
            assets="$(jq -c --arg target "$target" --arg file "$file" --arg sum "$sum" '.[$target] = {file: $file, sha256: $sum}' <<< "$assets")"
          done
          jq -n --arg version "$version" --argjson assets "$assets" '{version: $version, assets: $assets}' > npm/checksums.json
          jq -e '.assets | length == 3' npm/checksums.json
          jq -e 'all(.assets[]; .sha256 | test("^[0-9a-f]{64}$"))' npm/checksums.json
          jq -e '.assets | has("x86_64-pc-windows-msvc") | not' npm/checksums.json

      - uses: actions/upload-artifact@v4
        with:
          name: npm-checksums
          path: npm/checksums.json
          if-no-files-found: error

  windows-smoke:
    needs: [check, checksums]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: npm-checksums
          path: npm

      - name: install both tarballs the way a person would
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          node --version
          dest="$(cygpath -m "$RUNNER_TEMP")/tarballs"
          mkdir -p "$dest"
          port_tarball="$(cd packages/gaze-win32 && npm pack --pack-destination "$dest" --silent | tail -1)"
          gaze_tarball="$(npm pack --pack-destination "$dest" --silent | tail -1)"
          prefix="$(cygpath -m "$RUNNER_TEMP")/prefix"
          npm install -g --allow-scripts=@kikedealba/gaze --prefix "$prefix" "$dest/$port_tarball" "$dest/$gaze_tarball"
          test -f "$prefix/node_modules/@kikedealba/gaze-win32/package.json"
          test -f "$prefix/node_modules/@kikedealba/gaze/package.json"
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: no native files anywhere in the installed tree
        shell: bash
        run: |
          set -euo pipefail
          modules="$PREFIX/node_modules"
          found=""
          for root in "$modules/@kikedealba" "$modules/onnxruntime-web" "$modules/@huggingface/tokenizers" "$modules/smol-toml"; do
            if [ ! -d "$root" ]; then
              echo "missing $root" >&2
              exit 1
            fi
            hits="$(find "$root" \( -name '*.exe' -o -name '*.node' -o -name '*.dll' \))"
            found="$found$hits"
          done
          if [ -n "$found" ]; then
            echo "native files in the install:" >&2
            echo "$found" >&2
            exit 1
          fi

      - name: run the port with the fake embedder
        shell: bash
        env:
          GAZE_EMBEDDER: fake
          GAZE_PROJECT: smoke
          GAZE_BITA_BIN: C:\nonexistent\bita
          INKWELL_DOCS_DIR: ${{ runner.temp }}\smoke\docs
          INKWELL_DB_PATH: ${{ runner.temp }}\smoke\inkwell.db
          GAZE_DATA_DIR: ${{ runner.temp }}\smoke\data
          GAZE_CONFIG: ${{ runner.temp }}\smoke\data\config.toml
          KIT_REGISTRY_DIR: ${{ runner.temp }}\smoke\tools.d
        run: |
          set -euo pipefail
          mkdir -p "$GAZE_DATA_DIR"
          export PATH="$(cygpath -u "$PREFIX"):$PATH"
          version="$(jq -r .version package.json)"
          test "$(gaze --version)" = "gaze $version"
          gaze capabilities --json | jq -e .ok
          gaze remember "the smoke test remembers the deploy window" --title smoke --json | jq -e .ok
          gaze search "deploy window" --json | jq -e '.ok and (.data | tostring | contains("smoke"))'
          printf '%s' '{"session_id":"smoke-1","cwd":"C:\\","prompt":"what is the deploy window for the smoke test project"}' | gaze hook prompt
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | gaze mcp > "$RUNNER_TEMP/mcp.out"
          jq -e -s 'any(.[]; .id == 1 and .result.serverInfo) and any(.[]; .id == 2 and (.result.tools | length > 0))' "$RUNNER_TEMP/mcp.out"
          gaze daemon install
          gaze daemon status
          gaze daemon uninstall

  windows-model:
    needs: [check, checksums]
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gaze-model
          key: gaze-model-${{ hashFiles('packages/gaze-win32/src/embed.js') }}

      - name: tests against the real model
        shell: bash
        working-directory: packages/gaze-win32
        env:
          GAZE_TEST_MODEL: "1"
          GAZE_CACHE_DIR: ${{ runner.temp }}\gaze-model
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund || npm install --force --no-audit --no-fund
          npm test

  linux-smoke:
    needs: [checksums, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: npm-checksums
          path: npm

      - name: install the tarball the way a person would, and run it
        run: |
          set -euo pipefail
          npm --version
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          npm install -g --allow-scripts=@kikedealba/gaze --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/$tarball"
          "$RUNNER_TEMP/prefix/bin/gaze" capabilities --json | jq -e .ok

  npm:
    needs: [check, checksums, upload, windows-smoke, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-checksums
          path: npm

      - name: publish the windows port first
        working-directory: packages/gaze-win32
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already on npm; skipping the publish"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: publish the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already on npm; skipping the publish"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
