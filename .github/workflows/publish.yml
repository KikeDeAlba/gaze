name: publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: the tag and the manifests have to agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          npm_version="$(jq -r .version package.json)"
          plugin_version="$(jq -r .version .claude-plugin/plugin.json)"
          for found in "$cargo_version" "$npm_version" "$plugin_version"; do
            if [ "$tag" != "$found" ]; then
              echo "the release is $tag and the manifests say $cargo_version (Cargo.toml), $npm_version (package.json), $plugin_version (plugin.json)" >&2
              exit 1
            fi
          done

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: build dependencies for onnxruntime and native-tls
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: smoke test the binary
        shell: bash
        run: |
          bin=gaze
          if [ "$RUNNER_OS" = "Windows" ]; then bin=gaze.exe; fi
          "./target/${{ matrix.target }}/release/$bin" capabilities --json | jq -e .ok

      - name: package the binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_dir="target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="gaze-${version}-${{ matrix.target }}.exe"
            cp "$release_dir/gaze.exe" "$archive"
          else
            archive="gaze-${version}-${{ matrix.target }}.tar.gz"
            tar -czf "$archive" -C "$release_dir" gaze
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: upload the assets and their checksums to the release
        shell: bash
        working-directory: ${{ runner.temp }}/archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in gaze-*; do
            sha256sum "$file" > "$file.sha256"
          done
          gh release upload "$GITHUB_REF_NAME" gaze-* --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: embed the checksums of the built assets
        shell: bash
        env:
          ARCHIVES: ${{ runner.temp }}/archives
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          assets='{}'
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            ext=tar.gz
            if [ "$target" = "x86_64-pc-windows-msvc" ]; then ext=exe; fi
            file="gaze-${version}-${target}.${ext}"
            sum="$(sha256sum "$ARCHIVES/$file" | cut -d ' ' -f 1)"
            assets="$(jq -c --arg target "$target" --arg file "$file" --arg sum "$sum" '.[$target] = {file: $file, sha256: $sum}' <<< "$assets")"
          done
          jq -n --arg version "$version" --argjson assets "$assets" '{version: $version, assets: $assets}' > npm/checksums.json
          jq -e '.assets | length == 4' npm/checksums.json
          jq -e 'all(.assets[]; .sha256 | test("^[0-9a-f]{64}$"))' npm/checksums.json
          jq -e '.assets["x86_64-pc-windows-msvc"].file | endswith(".exe")' npm/checksums.json

      - uses: actions/upload-artifact@v7
        with:
          name: npm-checksums
          path: npm/checksums.json
          if-no-files-found: error

  windows-smoke:
    needs: checksums
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: npm-checksums
          path: npm

      - name: install the tarball from a local server the way a person would, and run it
        shell: bash
        run: |
          version="$(jq -r .version package.json)"
          serve_root="$RUNNER_TEMP/serve"
          mkdir -p "$serve_root/v$version"
          cp "$RUNNER_TEMP"/archives/* "$serve_root/v$version/"
          cat > "$RUNNER_TEMP/serve.mjs" <<'JS'
          import { createServer } from 'node:http'
          import { createReadStream, statSync } from 'node:fs'
          import path from 'node:path'
          const root = path.resolve(process.argv[2])
          createServer((req, res) => {
            let file
            try {
              file = path.join(root, decodeURIComponent(new URL(req.url, 'http://127.0.0.1').pathname))
            } catch {
              res.writeHead(400).end()
              return
            }
            if (!file.startsWith(root + path.sep)) { res.writeHead(403).end(); return }
            try {
              const stats = statSync(file)
              if (!stats.isFile()) { res.writeHead(404).end(); return }
              res.writeHead(200, { 'content-length': stats.size })
              createReadStream(file).on('error', () => res.destroy()).pipe(res)
            } catch {
              res.writeHead(404).end()
            }
          }).listen(38417, '127.0.0.1')
          JS
          node "$(cygpath -m "$RUNNER_TEMP/serve.mjs")" "$(cygpath -m "$serve_root")" &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:38417/v$version/gaze-$version-x86_64-pc-windows-msvc.exe"; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" != "1" ]; then
            echo "the local server never served the windows asset" >&2
            exit 1
          fi
          tarball="$(npm pack --pack-destination "$(cygpath -m "$RUNNER_TEMP")" --silent | tail -1)"
          prefix="$RUNNER_TEMP/prefix"
          npm --version
          GAZE_DOWNLOAD_BASE="http://127.0.0.1:38417" npm install -g --allow-scripts=@kikedealba/gaze --prefix "$(cygpath -m "$prefix")" "$(cygpath -m "$RUNNER_TEMP/$tarball")"
          vendor="$prefix/node_modules/@kikedealba/gaze/vendor"
          expected="$(jq -r '.assets["x86_64-pc-windows-msvc"].sha256' npm/checksums.json)"
          test -f "$vendor/$version/gaze.exe"
          test -f "$vendor/$version/.verified"
          marker="$vendor/$version/.verified"
          actual_size="$(wc -c < "$vendor/$version/gaze.exe" | tr -d ' ')"
          if [ "$(jq -r .sha256 "$marker")" != "$expected" ] || [ "$(jq -r .size "$marker")" != "$actual_size" ]; then
            echo "the .verified marker does not match sha256 $expected and size $actual_size" >&2
            cat "$marker" >&2
            exit 1
          fi
          prefix_unix="$(cygpath -u "$prefix")"
          GAZE_DOWNLOAD_BASE="http://127.0.0.1:1" PATH="$prefix_unix:$PATH" gaze capabilities --json | jq -e .ok
          ls -la "$vendor"
          leftovers="$(find "$vendor" \( -name '*.old-*' -o -name '.install-*' -o -name '*.zip' -o -name '*.tar.gz' \) )"
          if [ -n "$leftovers" ]; then
            echo "the installer left files behind in vendor:" >&2
            echo "$leftovers" >&2
            exit 1
          fi

  linux-smoke:
    needs: [checksums, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: npm-checksums
          path: npm

      - name: install the tarball the way a person would, and run it
        run: |
          set -euo pipefail
          npm --version
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          npm install -g --allow-scripts=@kikedealba/gaze --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/$tarball"
          "$RUNNER_TEMP/prefix/bin/gaze" capabilities --json | jq -e .ok

  npm:
    needs: [checksums, upload, windows-smoke, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-checksums
          path: npm

      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
