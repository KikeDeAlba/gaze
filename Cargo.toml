[package]
name = "gaze"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Per-project brain for coding agents: local knowledge store with hybrid vector search"
license = "MIT"
repository = "https://github.com/KikeDeAlba/gaze"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1"
toml = "0.9"
ulid = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
