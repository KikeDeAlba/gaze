[package]
name = "gaze"
version = "0.6.2"
edition = "2024"
rust-version = "1.88"
description = "Per-project brain for coding agents: local knowledge store with hybrid vector search"
license = "MIT"
repository = "https://github.com/KikeDeAlba/gaze"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1"
toml = "0.9"
ulid = "1"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
interprocess = "2"
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
